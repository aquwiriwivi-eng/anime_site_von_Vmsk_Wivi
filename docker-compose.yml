services:
  nginx:
    image: nginx:1.31.8-trixie
    container_name: "nginx_anime_container"
    networks:
      - frontend_net
      - monitor_net
    ports:
     - "80:80"
    volumes:
      - "./nginx/data:/usr/share/nginx/html"
      - "./nginx/nginx_configuration:/etc/nginx/conf.d/"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: "DockerFiles/Dockerfile_python_backend"
    restart: unless-stopped
    container_name: "api_backend_container"
    networks:
     - frontend_net
     - backend_net
    volumes:
     - "./python:/code/app"
    env_file:
      - path: ./env/.env.api
        required: true

# Use postgres/example user/password credentials

  postgre_sql:
    image: postgres:18.6-trixie
    container_name: "postgre_sql_container"
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - "Postgre_data:/var/lib/postgresql"
      - "./db:/docker-entrypoint-initdb.d/"
    env_file:
      - path: ./env/.env.db
        required: true
    networks:
      - backend_net

  adminer_sql:
    image: adminer:6
    container_name: "adminer_container"
    restart: unless-stopped
    ports:
      - 8051:8080
    networks:
      - backend_net

  prometheus:
    image: prom/prometheus:v3.16.0-busybox
    container_name: "prometheus"
    restart: unless-stopped
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitor_net

  grafana:
    image: grafana/grafana:13.2-slim
    container_name: "grafana"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    env_file:
      - path: ./env/.env.grafana.example
        required: true
    networks:
      - monitor_net

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
    networks:
      - monitor_net

  loki:
    image: grafana/loki:3.6.20
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - monitor_net

networks:
  frontend_net:
    name: frontend_net
    driver: bridge
  backend_net:
    name: backend_net
    driver: bridge
  monitor_net:
    name: monitor_net
    driver: bridge

volumes:
  Postgre_data:
    name: db_storage_volume
  prometheus_data:
    name: prometheus_volume
  grafana_data:
    name: grafana_volume
