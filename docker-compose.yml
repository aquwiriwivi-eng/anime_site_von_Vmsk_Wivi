services:
  nginx:
    image: nginx:1.31.8-trixie
    container_name: "nginx_anime_container"
    networks:
      - frontend_net
    ports:
     - "80:80"
    volumes:
      - "./nginx/data:/usr/share/nginx/html"
      - "./nginx/nginx_configuration:/etc/nginx/conf.d/"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: "DockerFiles/Dockerfile_python_backend"
    container_name: "api_backend_container"
    networks:
     - frontend_net
     - backend_net
    volumes:
     - "./python:/code/app"
    env_file:
      - path: ./.env.api.example
        required: true
      - path: ./.env.api
        required: false
    restart: unless-stopped

# Use postgres/example user/password credentials

  postgre_sql:
    image: postgres:18.6-trixie
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - "Postgre_data:/var/lib/postgresql"
      - "./db:/docker-entrypoint-initdb.d/"
    env_file: # Password and username will be rewrite from .env.db
      - path: ./.env.db.example
        required: true
      - path: ./.env.db
        required: false
    networks:
      - backend_net
    container_name: "postgre_sql_container"

  adminer_sql:
    image: adminer:6
    restart: unless-stopped
    ports:
      - 8051:8080
    networks:
      - backend_net
    container_name: "adminer_container"

  # prometheus:
  #   image: prom/prometheus:latest-busybox
  #   container_name: prometheus
  #   expose:
  #     - 9090
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus


networks:
  frontend_net:
    name: frontend_net
    driver: bridge
  backend_net:
    name: backend_net
    driver: bridge

volumes:
  Postgre_data:
    name: db_storage_volume

