<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YummyAnime Lite — Каталог аниме</title>
    <style>
        /* Базовые переменные светлой нежно-розовой темы */
        :root {
            --bg-pink-overlay: rgba(252, 231, 243, 0.90); /* Розовая заливка поверх фонового фото (картинка видна на 10%) */
            --card-bg: rgba(255, 255, 255, 0.85);
            --header-bg: rgba(255, 255, 255, 0.8);
            --accent-color: #ec4899; /* Насыщенный розовый акцент */
            --text-main: #292524;
            --text-muted: #78716c;
            --star-color: #f59e0b;
            --border-color: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 50px;
            /* Наложение прозрачного нежно-розового цвета на фоновую картинку */
            background: linear-gradient(var(--bg-pink-overlay), var(--bg-pink-overlay)),
                        url('background.png') center/cover fixed no-repeat #fce7f3;
        }

        /* Шапка сайта */
        header {
            background-color: var(--header-bg);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 10px rgba(236, 72, 153, 0.05);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        /* Основной контейнер */
        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        /* Секция: Аниме недели (3 карточки 16:9) */
        .featured-section {
            margin-bottom: 45px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .featured-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            backdrop-filter: blur(5px);
        }

        .featured-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.2);
        }

        .art-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Соотношение сторон 16:9 */
            overflow: hidden;
            background-color: #fbcfe8;
        }

        .art-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .featured-card:hover .art-img {
            transform: scale(1.05);
        }

        .badge-week {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--accent-color);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .featured-content {
            padding: 16px;
        }

        .featured-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* Сетка обычного каталога */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.15);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 140%;
            overflow: hidden;
            background-color: #fbcfe8;
        }

        .poster-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .anime-card:hover .poster-img {
            transform: scale(1.05);
        }

        .rating-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--star-color);
            font-weight: 700;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .anime-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .genre-tag {
            font-size: 11px;
            background-color: #fbcfe8;
            color: #9d174d;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .description {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-container">
            <a href="#" class="logo">Yummy<span>Anime</span></a>
        </div>
    </header>

    <main>
        <!-- Секция: Аниме недели (16:9 арты) -->
        <section class="featured-section">
            <h2 class="section-title">Аниме недели</h2>
            <div class="featured-grid" id="featuredGrid"></div>
        </section>

        <!-- Основной каталог -->
        <section>
            <h2 class="section-title">Каталог аниме</h2>
            <div class="anime-grid" id="animeGrid"></div>
        </section>
    </main>

    <script>
        // 1. Данные для "Аниме недели" (Формат 16:9)
        const weeklyAnime = [
            {
                id: 101,
                title: "Твое имя",
                originalTitle: "Kimi no Na wa",
                art: "https://m.media-amazon.com/images/M/MVBODNmMTI3OTgtNWY3NC00YjBhLTg4YTYtNzE1Y2I4Y2FlY2JkXkEyXkFqcGc@._V1_FMjpg_UX1280_.jpg",
                description: "История о связи двух незнакомцев, меняющихся телами во снах."
            },
            {
                id: 102,
                title: "Унесённые призраками",
                originalTitle: "Sen to Chihiro no Kamikakushi",
                art: "https://m.media-amazon.com/images/M/MVBMjMyYjM3OTktYTBhNS00N2EzLWExYjAtN2Q4Y2NhYTY4YzA1XkEyXkFqcGc@._V1_FMjpg_UX1280_.jpg",
                description: "Девочка Тихиро попадает в таинственный мир, полный духов и волшебства."
            },
            {
                id: 103,
                title: "Судзумэ закрывает двери",
                originalTitle: "Suzume no Tojimari",
                art: "https://m.media-amazon.com/images/M/MVBNDdhYTc2NTItZDkyNy00N2RhLWI4MTMtNmEwMjNlNmYwYjdhXkEyXkFqcGc@._V1_FMjpg_UX1280_.jpg",
                description: "Семнадцатилетняя Судзумэ помогает странному юноше закрывать загадочные двери по всей Японии."
            }
        ];

        // 2. Данные для основного каталога (Формат вертикальных постеров)
        const animeData = [
            {
                id: 1,
                title: "Атака титанов",
                originalTitle: "Shingeki no Kyojin (2013)",
                rating: "9.1",
                genres: ["Экшен", "Драма", "Фэнтези"],
                poster: "https://m.media-amazon.com/images/M/MVBmMzI1MGEyM2MtYmUwNC00M2I2LWI4MmItMzc4Y2VkYTNhMzA2XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
                description: "Уже 100 лет человечество живёт за огромными стенами, защищающими от гигантских людоедов — титанов. Но в один день стена рушится."
            },
            {
                id: 2,
                title: "Магическая битва",
                originalTitle: "Jujutsu Kaisen (2020)",
                rating: "8.7",
                genres: ["Экшен", "Сёнэн", "Мистика"],
                poster: "https://m.media-amazon.com/images/M/MVBmM2NmNmFlYjctN2E3MS00Y2VkLTg4M2QtYjY2ODkyMzBmOTE0XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
                description: "Старшеклассник Юдзи Итадори проглатывает древний артефакт и сам становится вместилищем могущественного демона."
            },
            {
                id: 3,
                title: "Клинок, рассекающий демонов",
                originalTitle: "Kimetsu no Yaiba (2019)",
                rating: "8.6",
                genres: ["Экшен", "Приключения"],
                poster: "https://m.media-amazon.com/images/M/MVBNzJkY2Y2Y2YtYTI3NC00YjBhLWE1NDgtM2MzOGM5NTk5NzRiXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
                description: "Танджиро решает стать истребителем демонов, чтобы найти способ вернуть человеческий облик своей сестре."
            }
        ];

        // Функция рендеринга
        function initPage() {
            // Отрисовка Аниме Недели
            const featuredGrid = document.getElementById('featuredGrid');
            featuredGrid.innerHTML = weeklyAnime.map(item => `
                <div class="featured-card">
                    <div class="art-wrapper">
                        <img class="art-img" src="${item.art}" alt="${item.title}">
                        <div class="badge-week">Топ недели</div>
                    </div>
                    <div class="featured-content">
                        <h3 class="featured-title">${item.title}</h3>
                        <p class="description">${item.description}</p>
                    </div>
                </div>
            `).join('');

            // Отрисовка основного каталога
            const animeGrid = document.getElementById('animeGrid');
            animeGrid.innerHTML = animeData.map(anime => `
                <div class="anime-card">
                    <div class="poster-wrapper">
                        <img class="poster-img" src="${anime.poster}" alt="${anime.title}">
                        <div class="rating-badge">★ ${anime.rating}</div>
                    </div>
                    <div class="card-content">
                        <h3 class="anime-title">${anime.title}</h3>
                        <div class="anime-sub">${anime.originalTitle}</div>
                        <div class="genres">
                            ${anime.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}
                        </div>
                        <p class="description">${anime.description}</p>
                    </div>
                </div>
            `).join('');
        }

        initPage();
    </script>
</body>
</html>
