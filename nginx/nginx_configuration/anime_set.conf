server {
    listen 80;
    # Проксирование поисковых запросов и API на бэкенд FastAPI
    location /api/ {
        # Если FastAPI запущен в том же Docker-наборе, 
        # вместо localhost можно написать имя контейнера бэкенда (например, http://fastapi_app:8000)
        proxy_pass http://api:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
