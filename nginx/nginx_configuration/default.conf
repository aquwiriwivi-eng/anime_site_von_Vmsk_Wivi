server {
    listen      80;
    listen  [::]:80;
    server_name localhost;

    # 1. Отдаем статику фронтенда и настраиваем SPA-роутинг
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /anime_photo/ { # Отдаем аниме постеры!
        alias /usr/share/nginx/html/anime_photo/;   # путь внутри контейнера nginx
}

    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=admin_api:10m   rate=30r/m;
    limit_req_zone $binary_remote_addr zone=sync_api:10m    rate=20r/m;

    location = /api/admin/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin/ {
        # allow 203.0.113.10;   # твой IP или подсеть VPN
        # deny  all;
        limit_req zone=admin_api burst=20 nodelay;
        client_max_body_size 11m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/search/sync {
        limit_req zone=sync_api burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # 2. Перенаправляем все запросы /api/... на бэкенд
    location /api/ {
        # ВАЖНО: Замените 'api' на имя сервиса вашего бэкенда из docker-compose.yml 
        # или на имя контейнера бэкенда (например, http://anime-backend:8000)
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Передача реального IP и протокола клиента
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
