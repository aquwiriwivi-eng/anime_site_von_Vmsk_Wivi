server {
    listen      80;
    listen  [::]:80;
    server_name localhost;

    # 1. Отдаем статику фронтенда и настраиваем SPA-роутинг
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Перенаправляем все запросы /api/... на бэкенд
    location /api/ {
        # ВАЖНО: Замените 'backend' на имя сервиса вашего бэкенда из docker-compose.yml 
        # или на имя контейнера бэкенда (например, http://anime-backend:8000)
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Передача реального IP и протокола клиента
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
